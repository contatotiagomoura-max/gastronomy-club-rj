name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack site
        run: |
          set -euo pipefail
          mkdir -p publish
          cat pack-v3/site.tar.gz.b64.* | base64 -d > /tmp/site.tar.gz
          tar -xzf /tmp/site.tar.gz -C publish
          test -f publish/index.html
          # Replace site files at the repo root so stale hashed bundles are dropped
          rm -rf assets images
          rm -f index.html 404.html favicon.svg _redirects .nojekyll
          shopt -s dotglob
          cp -a publish/. .
          touch .nojekyll

      - name: Commit site files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll 404.html _redirects favicon.svg index.html assets images
          if git diff --cached --quiet; then
            echo "No site file changes to commit"
          else
            git commit -m "Publish Gastronomy Club RJ site files [site-sync]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
